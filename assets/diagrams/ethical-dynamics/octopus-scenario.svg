<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 970" role="img" aria-labelledby="title desc"><title id="title">Octopus scenario: a hypothetical calculation</title><desc id="desc">Use the religious-alignment model above • all fourteen inputs are stipulated</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53716e"/></marker></defs><rect width="1080" height="970" rx="24" fill="#f5f5ee"/><g font-family="Arial,Helvetica,sans-serif" fill="#193b3b"><text x="42" y="48" font-size="14" fill="#53716e">MODEL OF ETHICAL DYNAMICS</text><text x="42" y="92" font-size="32" fill="#193b3b">Octopus scenario: a hypothetical calculation</text><text x="42" y="126" font-size="17" fill="#193b3b">Use the religious-alignment model above • all fourteen inputs are stipulated</text><rect x="42" y="165" width="996" height="190" rx="14" fill="#e4eeea" stroke="#cedbd4"/><text x="62" y="197" font-size="21" fill="#193b3b">Scenario inputs</text><text x="62" y="228" font-size="17" fill="#193b3b">C .7 · RI .6 · F .4 · B .6</text><text x="62" y="255" font-size="17" fill="#193b3b">CC .5 · PS .3 · ES .7 · NF .8</text><text x="62" y="282" font-size="17" fill="#193b3b">R .8 · FT .7 · EP .4 · TC .9 · IF .9</text><text x="62" y="309" font-size="17" fill="#193b3b">Religious alignment ARP .4</text><path d="M540 355V391" fill="none" stroke="#53716e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="399" width="310" height="106" rx="14" fill="#e4e4f2" stroke="#cedbd4"/><text x="62" y="431" font-size="21" fill="#193b3b">Total cost · TEC</text><text x="62" y="462" font-size="17" fill="#193b3b">1.2565</text><rect x="385" y="399" width="310" height="106" rx="14" fill="#e4e4f2" stroke="#cedbd4"/><text x="405" y="431" font-size="21" fill="#193b3b">Capacity · AT</text><text x="405" y="462" font-size="17" fill="#193b3b">0.725</text><rect x="728" y="399" width="310" height="106" rx="14" fill="#e4e4f2" stroke="#cedbd4"/><text x="748" y="431" font-size="21" fill="#193b3b">Baseline · E_base</text><text x="748" y="462" font-size="17" fill="#193b3b">0.65</text><path d="M197 505V542H540V573" fill="none" stroke="#53716e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M540 505V542H540V573" fill="none" stroke="#53716e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M883 505V542H540V573" fill="none" stroke="#53716e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="200" y="580" width="680" height="125" rx="14" fill="#d7e6db" stroke="#cedbd4"/><text x="220" y="612" font-size="21" fill="#193b3b">Target index · ED*</text><text x="220" y="643" font-size="17" fill="#193b3b">0.725 × 0.65 / 1.2565 ≈ 0.37505</text><text x="220" y="670" font-size="17" fill="#193b3b">Clipping leaves this value unchanged.</text><rect x="42" y="746" width="996" height="154" rx="14" fill="#eee8d6" stroke="#cedbd4"/><text x="62" y="778" font-size="21" fill="#193b3b">How to read the result</text><text x="62" y="809" font-size="17" fill="#193b3b">Target: avoiding consumption of octopus.</text><text x="62" y="836" font-size="17" fill="#193b3b">Affordable, acceptable substitutes are assumed, not reported as available products.</text><text x="62" y="863" font-size="17" fill="#193b3b">The result is an index, not a forecast that 37.5% of people change their diet.</text><text x="42" y="936" font-size="14" fill="#193b3b">BYTESEISMIC  /  Editorial reconstruction · November 2026</text></g></svg>