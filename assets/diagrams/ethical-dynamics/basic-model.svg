<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1040" role="img" aria-labelledby="title desc"><title id="title">From constraints to a target disposition</title><desc id="desc">A conceptual accounting model • arrows express assumptions, not established causes</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53716e"/></marker></defs><rect width="1080" height="1040" rx="24" fill="#f5f5ee"/><g font-family="Arial,Helvetica,sans-serif" fill="#193b3b"><text x="42" y="48" font-size="14" fill="#53716e">MODEL OF ETHICAL DYNAMICS</text><text x="42" y="92" font-size="32" fill="#193b3b">From constraints to a target disposition</text><text x="42" y="126" font-size="17" fill="#193b3b">A conceptual accounting model • arrows express assumptions, not established causes</text><rect x="42" y="163" width="310" height="210" rx="14" fill="#f2e4dc" stroke="#cedbd4"/><text x="62" y="195" font-size="21" fill="#193b3b">Psychological cost · PE</text><text x="62" y="226" font-size="17" fill="#193b3b">Compassion · C</text><text x="62" y="253" font-size="17" fill="#193b3b">Indignation · RI</text><text x="62" y="280" font-size="17" fill="#193b3b">Fear of consequences · F</text><text x="62" y="307" font-size="17" fill="#193b3b">Desire for belonging · B</text><rect x="385" y="163" width="310" height="210" rx="14" fill="#e4e4f2" stroke="#cedbd4"/><text x="405" y="195" font-size="21" fill="#193b3b">Social cost · SE</text><text x="405" y="226" font-size="17" fill="#193b3b">Cultural conditioning · CC</text><text x="405" y="253" font-size="17" fill="#193b3b">Power structures · PS</text><text x="405" y="280" font-size="17" fill="#193b3b">Exposure to suffering · ES</text><text x="405" y="307" font-size="17" fill="#193b3b">Narrative framing · NF</text><rect x="728" y="163" width="310" height="210" rx="14" fill="#e4eeea" stroke="#cedbd4"/><text x="748" y="195" font-size="21" fill="#193b3b">Lifestyle cost · LE</text><text x="748" y="226" font-size="17" fill="#193b3b">Free time · FT; resources · R</text><text x="748" y="253" font-size="17" fill="#193b3b">Environmental pressure · EP</text><text x="748" y="280" font-size="17" fill="#193b3b">Technological capacity · TC</text><text x="748" y="307" font-size="17" fill="#193b3b">Information flow · IF</text><path d="M197 373V405H540V433" fill="none" stroke="#53716e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M540 373V405H540V433" fill="none" stroke="#53716e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M883 373V405H540V433" fill="none" stroke="#53716e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="335" y="438" width="410" height="90" rx="14" fill="#dfe8e3" stroke="#cedbd4"/><text x="355" y="470" font-size="21" fill="#193b3b">Total ethical cost · TEC</text><text x="355" y="501" font-size="17" fill="#193b3b">TEC = PE + SE + LE; range 0–3</text><rect x="42" y="564" width="470" height="142" rx="14" fill="#e4eeea" stroke="#cedbd4"/><text x="62" y="596" font-size="21" fill="#193b3b">Capacity · AT</text><text x="62" y="627" font-size="17" fill="#193b3b">clip(0.25 × (R + FT + TC + IF − EP), 0, 1)</text><text x="62" y="654" font-size="17" fill="#193b3b">Resources, time, technology and information</text><text x="62" y="681" font-size="17" fill="#193b3b">raise capacity; environmental pressure lowers it.</text><rect x="548" y="564" width="490" height="142" rx="14" fill="#eee8d6" stroke="#cedbd4"/><text x="568" y="596" font-size="21" fill="#193b3b">Baseline target disposition · E_base</text><text x="568" y="627" font-size="17" fill="#193b3b">E_base = (C + RI) / 2</text><text x="568" y="654" font-size="17" fill="#193b3b">A target-specific starting index,</text><text x="568" y="681" font-size="17" fill="#193b3b">not a measure of objective moral worth.</text><path d="M540 528V738" fill="none" stroke="#53716e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M277 706V724H520V738" fill="none" stroke="#53716e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M793 706V724H560V738" fill="none" stroke="#53716e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="200" y="744" width="680" height="116" rx="14" fill="#d7e6db" stroke="#cedbd4"/><text x="220" y="776" font-size="21" fill="#193b3b">Bounded target · ED*</text><text x="220" y="807" font-size="17" fill="#193b3b">When TEC &gt; 0: clip(AT × E_base / TEC, 0, 1)</text><text x="220" y="834" font-size="17" fill="#193b3b">When TEC = 0: E_base (an explicit no-cost convention)</text><path d="M540 860V884" fill="none" stroke="#53716e" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><rect x="42" y="891" width="996" height="110" rx="14" fill="#efeee5" stroke="#cedbd4"/><text x="62" y="923" font-size="21" fill="#193b3b">Change over time · hypotheses to test</text><text x="62" y="954" font-size="17" fill="#193b3b">ED(t+1) = (1 − ρ)ED(t) + ρED*(t), with 0 ≤ ρ ≤ 1.</text><text x="62" y="981" font-size="17" fill="#193b3b">Proposed lagged loops: RI ↔ ES, RI ↔ NF, C ↔ NF; ED → resources.</text></g></svg>